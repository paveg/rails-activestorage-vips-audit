name: CI

on:
  push:
    branches: [main]
  pull_request:

# Declared here so least privilege holds regardless of the repository-level
# default, which an administrator can change.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck skills/rails-activestorage-vips-audit/scripts/*.sh tests/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh tests/collect-evidence-test.sh
